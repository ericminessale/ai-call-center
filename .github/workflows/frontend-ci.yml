name: Frontend CI

# Enforces the frontend TypeScript typecheck so the ~111-error backlog that was
# fixed can't silently creep back. `npm run build` is `tsc && vite build`
# (see frontend/package.json), and the prod image (frontend/Dockerfile.prod)
# builds via `npm run build` — so a type regression fails both this check and
# the prod image build. The explicit `typecheck` step below surfaces type
# errors on their own, before the (slower) bundling step.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24' # matches frontend/Dockerfile.prod (current LTS)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Lockfile drift is a build failure. Silently falling back to
      # `npm install` made local, CI, and production dependency trees differ.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production build
        run: npm run build
