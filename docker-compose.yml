services:
  # PostgreSQL Database (with pgvector for RAG)
  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: callcenter-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callcenter}
      POSTGRES_USER: ${POSTGRES_USER:-ccuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccuser} -d ${POSTGRES_DB:-callcenter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Queue
  redis:
    image: redis:7-alpine
    container_name: callcenter-redis
    hostname: redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: backend
    container_name: callcenter-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ccuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-callcenter}
      REDIS_URL: redis://redis:6379/0

      # SignalWire Configuration
      SIGNALWIRE_SPACE: ${SIGNALWIRE_SPACE}
      SIGNALWIRE_SPACE_URL: https://${SIGNALWIRE_SPACE}
      SIGNALWIRE_PROJECT_ID: ${SIGNALWIRE_PROJECT_ID}
      SIGNALWIRE_API_TOKEN: ${SIGNALWIRE_API_TOKEN}
      SIGNALWIRE_PHONE_NUMBER: ${SIGNALWIRE_PHONE_NUMBER}
      SIGNALWIRE_FROM_NUMBER: ${SIGNALWIRE_FROM_NUMBER:-${SIGNALWIRE_PHONE_NUMBER}}

      # SWML Basic Auth (for AI agents)
      SWML_BASIC_AUTH_USER: ${SWML_BASIC_AUTH_USER}
      SWML_BASIC_AUTH_PASSWORD: ${SWML_BASIC_AUTH_PASSWORD}

      # Synthetic-caller test harness (testing/run_scenario.py) — off unless
      # the operator opts in via .env.
      TESTING_HARNESS_ENABLED: ${TESTING_HARNESS_ENABLED:-false}

      # Security — NO committed fallbacks (DEPLOY-C2). A default here would
      # defeat the _require_env fail-fast in app/__init__.py: an operator who
      # forgot to set these would boot with a publicly-known JWT signing key,
      # letting anyone mint valid admin tokens. Leave them unset and the app
      # refuses to start until real values are provided (generate with
      # `python -c "import secrets; print(secrets.token_urlsafe(32))"`).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      SUBSCRIBER_PASSWORD_KEY: ${SUBSCRIBER_PASSWORD_KEY}
      # First-admin seed (consumed by entrypoint.sh after migrations). If
      # ADMIN_PASSWORD is unset the seed step is skipped — no default admin
      # with a known password is ever created (DEPLOY-C3).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Webhook/internal HTTP Basic auth (SEC-01) — shared with ai-agents.
      # Backend VALIDATES these on /api/webhooks/* and /api/internal/*.
      # WEBHOOK_AUTH_REQUIRED defaults to 'true' (enforce) when unset; .env
      # sets it 'false' for the soft-webhook interim. /api/internal/* always
      # enforces regardless of the flag.
      WEBHOOK_AUTH_USER: ${WEBHOOK_AUTH_USER}
      WEBHOOK_AUTH_PASSWORD: ${WEBHOOK_AUTH_PASSWORD}
      # Callback URL auth scheme — 'token' stops embedding WEBHOOK_AUTH in
      # the URLs rendered into SWML (CRITICAL-1 Phase 2 / HIGH-4). Requires
      # INTERNAL_AUTH_PASSWORD; the inbound side accepts both schemes either
      # way, so flipping this is non-breaking and reversible.
      WEBHOOK_URL_AUTH: ${WEBHOOK_URL_AUTH:-basic}
      WEBHOOK_AUTH_REQUIRED: ${WEBHOOK_AUTH_REQUIRED:-true}
      # Segregated internal-API secret (falls back to WEBHOOK_AUTH_* when unset).
      INTERNAL_AUTH_USER: ${INTERNAL_AUTH_USER:-}
      INTERNAL_AUTH_PASSWORD: ${INTERNAL_AUTH_PASSWORD:-}
      # Feature flags — off by default; operator opts in. See .env.example.
      COACH_ENABLED: ${COACH_ENABLED:-false}
      # In-process workspace GC (HIGH-7). Default-on in hosted-demo mode so the
      # reaper no longer depends on the demo-reset cron container; 'false' hands
      # GC back to an external scheduler. No-op for clone-and-own.
      WORKSPACE_GC_IN_PROCESS: ${WORKSPACE_GC_IN_PROCESS:-true}
      WORKSPACE_GC_INTERVAL_SECONDS: ${WORKSPACE_GC_INTERVAL_SECONDS:-3600}

      # External URL (for SignalWire callbacks when using ngrok)
      # Set this to your ngrok URL so SignalWire can reach your local server
      EXTERNAL_URL: ${EXTERNAL_URL}

      # Application
      FLASK_APP: app
      FLASK_ENV: ${FLASK_ENV:-production}
      # Trusted reverse-proxy hop count (SEC-07). Default 1 because the
      # in-compose nginx always fronts /api — with 0, request.remote_addr
      # is the nginx container IP for every client and the per-IP rate
      # limits collapse into one shared global bucket. Set 2 with
      # Cloudflare in front; 0 only if you expose :5000 directly.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # OpenAI moderation key (optional content moderation of user text).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Where raw webhook payloads (post-prompt + debug events) are captured
      # for offline debugging. /app is the bind-mounted ./backend dir, so these
      # land on the host at signalwire-call-center/backend/captures/.
      WEBHOOK_CAPTURE_DIR: ${WEBHOOK_CAPTURE_DIR:-/app/captures}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    # entrypoint.sh runs wait-for-redis + flask db upgrade + admin seed ONCE,
    # then execs the gunicorn command passed as args (DEPLOY-H1).
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["gunicorn", "--workers", "4", "--threads", "100", "--bind", "0.0.0.0:5000", "--timeout", "120", "wsgi:app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5000}
    container_name: callcenter-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5000}
      VITE_SIGNALWIRE_PHONE_NUMBER: ${VITE_SIGNALWIRE_PHONE_NUMBER:-${SIGNALWIRE_PHONE_NUMBER}}
      VITE_SIGNALWIRE_HOST: ${VITE_SIGNALWIRE_HOST:-${SIGNALWIRE_SPACE}}
      VITE_FABRIC_APPLICATION_ID: ${FABRIC_APPLICATION_ID:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3100:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # SignalWire AI Agents
  ai-agents:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile
    container_name: callcenter-agents
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      # SignalWire Configuration
      SIGNALWIRE_SPACE: ${SIGNALWIRE_SPACE}
      SIGNALWIRE_PROJECT_ID: ${SIGNALWIRE_PROJECT_ID}
      SIGNALWIRE_API_TOKEN: ${SIGNALWIRE_API_TOKEN}

      # Database (shared with backend, for pgvector RAG)
      DATABASE_URL: postgresql://${POSTGRES_USER:-ccuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-callcenter}

      # Backend Integration
      BACKEND_URL: http://backend:5000

      # Agent Configuration
      AGENT_PORT: 8080
      AGENT_HOST: 0.0.0.0

      # Agent Base URL for multi-agent transfers (externally accessible URL)
      # This should be your ngrok URL or public domain pointing to ai-agents
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://ai-agents:8080}

      # SWML Basic Auth
      SWML_BASIC_AUTH_USER: ${SWML_BASIC_AUTH_USER}
      SWML_BASIC_AUTH_PASSWORD: ${SWML_BASIC_AUTH_PASSWORD}

      # Webhook/internal HTTP Basic auth (SEC-01) — shared with backend.
      # Used by _signed_webhook_url to sign callback URLs handed to SignalWire,
      # and to authenticate the /api/internal/mcp-gateways fetch at boot.
      WEBHOOK_AUTH_USER: ${WEBHOOK_AUTH_USER}
      WEBHOOK_AUTH_PASSWORD: ${WEBHOOK_AUTH_PASSWORD}
      # Callback URL auth scheme — 'token' stops embedding WEBHOOK_AUTH in
      # the URLs rendered into SWML (CRITICAL-1 Phase 2 / HIGH-4). Requires
      # INTERNAL_AUTH_PASSWORD; the inbound side accepts both schemes either
      # way, so flipping this is non-breaking and reversible.
      WEBHOOK_URL_AUTH: ${WEBHOOK_URL_AUTH:-basic}
      # Segregated internal-API secret used by _internal_auth() for the
      # /api/internal/* fetches (falls back to WEBHOOK_AUTH_* when unset).
      INTERNAL_AUTH_USER: ${INTERNAL_AUTH_USER:-}
      INTERNAL_AUTH_PASSWORD: ${INTERNAL_AUTH_PASSWORD:-}

      # The mcp_gateway skill's SSRF protection blocks RFC1918 hosts by
      # default. The bundled demo-mcp-gateway is reachable via its
      # docker-network hostname (172.x.x.x), which trips that check.
      # Set this to allow private URLs so the demo works out of the
      # box; remove or override in production if you only ever point
      # at public gateway URLs.
      SWML_ALLOW_PRIVATE_URLS: ${SWML_ALLOW_PRIVATE_URLS:-true}

      # Debug telemetry (opt-in). When true, the agents point SignalWire's debug
      # webhook at the backend so a test call's turn-by-turn events land in
      # backend/captures/debug-events.jsonl. Level 2 is high volume (many POSTs
      # per call) — keep OFF except when actively debugging a specific call.
      DEBUG_WEBHOOK_ENABLED: ${DEBUG_WEBHOOK_ENABLED:-false}
      DEBUG_WEBHOOK_LEVEL: ${DEBUG_WEBHOOK_LEVEL:-2}

      PYTHONUNBUFFERED: 1
    volumes:
      - ./ai-agents:/app
    ports:
      - "8080:8080"
      # Loopback only (F-01): the admin API can read/write caller-memory
      # collections — never expose it on the LAN. Backend reaches it over
      # the compose network; host access is for local debugging only.
      - "127.0.0.1:8081:8081"
    command: python main_agent.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DemoShop MCP Gateway — bundled demo for the External Tools feature.
  # Runs the SDK's mcp-gateway CLI in front of a small SQLite-backed
  # MCP server with seeded e-commerce data (customers, orders, returns).
  # Internal-network only — no external port exposure. Cloners replace
  # this with their own MCP gateway when they're ready.
  demo-mcp-gateway:
    build:
      context: ./demo-mcp
      dockerfile: Dockerfile
    container_name: callcenter-demo-mcp
    hostname: demo-mcp-gateway
    environment:
      DEMO_MCP_USER: ${DEMO_MCP_USER:-demo}
      DEMO_MCP_PASSWORD: ${DEMO_MCP_PASSWORD:-demo}
      SHOP_DB_PATH: /data/shop.db
      # Hosted-demo gate for the shop-reset listener on 8101
      # (demo-mcp/shop_admin.py). The shop DB is shared by every visitor
      # and start_return writes to it, so the demo-reset cron restores it
      # nightly. Unset — i.e. every clone-and-own install — means the
      # listener never binds and nothing can wipe this shop's data.
      TENANCY_MODE: ${TENANCY_MODE:-}
      DEMO_MODE: ${DEMO_MODE:-}
      # Basic-auth for that listener; falls back to the DEMO_MCP_* pair
      # above when unset, so the demo needs no additional secret.
      SHOP_RESET_USER: ${SHOP_RESET_USER:-}
      SHOP_RESET_PASSWORD: ${SHOP_RESET_PASSWORD:-}
      PYTHONUNBUFFERED: 1
    volumes:
      - demo_mcp_data:/data
    # No ports: stanza on purpose — only ai-agents (internal) talks to
    # 8100, and only the demo-reset cron talks to 8101.
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u ${DEMO_MCP_USER:-demo}:${DEMO_MCP_PASSWORD:-demo} http://localhost:8100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: callcenter-nginx
    depends_on:
      - backend
      - frontend
      - ai-agents
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  demo_mcp_data:
    driver: local

networks:
  default:
    name: callcenter-network
    driver: bridge
