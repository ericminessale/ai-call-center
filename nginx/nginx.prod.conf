events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:5000;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream agents {
        server ai-agents:8080;
    }

    # Real client IP for logs / rate limiting behind this proxy.
    # (The Flask app additionally trusts TRUSTED_PROXY_COUNT hops.)
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~."    $http_x_forwarded_proto;
    }

    # ----- HTTP :80 -----
    # Redirect everything to HTTPS. Keep /.well-known reachable so an
    # ACME/Let's Encrypt HTTP-01 challenge can renew certs without downtime.
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----- HTTPS :443 -----
    # DEPLOY-H2: the dev config only listened on :80 (plaintext) despite compose
    # publishing 443 and mounting nginx/ssl. Place your cert + key at
    # nginx/ssl/fullchain.pem and nginx/ssl/privkey.pem (Let's Encrypt or the
    # Cloudflare origin cert). If Cloudflare terminates TLS in front, this still
    # gives an encrypted origin hop ("Full (strict)").
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 25m;

        # Frontend (production static build served by the frontend container)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Terminating TLS here, so advertise https to the app regardless of
            # any upstream header (fixes session-cookie Secure + rate-limit IP).
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Socket.IO
        location /socket.io {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # SignalWire tap-stream (call audio monitoring)
        location /ws/tap-stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # AI agent SWML routes (SignalWire fetches these). The 8081 admin API
        # (/reindex,/search) is intentionally NOT exposed here and its host
        # port publish is dropped in docker-compose.prod.yml — it stays on the
        # internal docker network only (DEPLOY-C5).
        #
        # NOTE (DEPLOY-C5): these return SWML/JSON and are reachable by anyone
        # who can hit the host. To require auth, uncomment the auth_basic lines
        # below AND ensure the SignalWire-side URLs that invoke these agents
        # carry matching Basic credentials, or inbound/AI calls will 401.
        location ~ ^/(receptionist|sales|support|sales-ai|support-ai|outbound-sales|outbound-support|health) {
            # auth_basic "agents";
            # auth_basic_user_file /etc/nginx/ssl/agents.htpasswd;
            proxy_pass http://agents;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # The dev-only `location ^~ /repro` diagnostic proxy to
        # host.docker.internal:3001 is deliberately omitted here (DEPLOY-M6) —
        # it 502s on Linux and shouldn't ship.
    }
}
