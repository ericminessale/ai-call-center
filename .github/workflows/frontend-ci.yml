name: Frontend CI

# Enforces the frontend TypeScript typecheck so the ~111-error backlog that was
# fixed can't silently creep back. `npm run build` is `tsc && vite build`
# (see frontend/package.json), and the prod image (frontend/Dockerfile.prod)
# builds via `npm run build` — so a type regression fails both this check and
# the prod image build. The explicit `typecheck` step below surfaces type
# errors on their own, before the (slower) bundling step.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18' # matches frontend/Dockerfile.prod
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Mirrors the Dockerfile.prod install line: prefer the lockfile, fall
      # back to a plain install if it has drifted (see project CLAUDE.md).
      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production build
        run: npm run build
