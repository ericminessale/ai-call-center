# Static SPA server for the production frontend container (DEPLOY-C4).
# The main reverse-proxy nginx proxies `location /` here; this just serves
# the built assets with a history-API fallback so client-side routes resolve.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; never cache the HTML entrypoint.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
